<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elimina Dati</title>
</head>

<body>
    <h1>Gestione Dati</h1>

    <button onclick="resetTable()">Reset Tabella</button>
    <button onclick="toggleDeleteColumn()">Elimina Colonna</button>

    <div id="deleteColumnSection" style="display:none;">
        <label for="columnSelect">Seleziona colonna:</label>
        <select id="columnSelect">
            <option value="">-- Scegli colonna --</option>
            <option value="ID">ID</option>
            <option value="Nome">Nome</option>
            <option value="Email">Email</option>
            <option value="Città">Città</option>
            <option value="Data_Iscrizione">Data Iscrizione</option>
        </select>
        <button onclick="deleteColumn()">Conferma</button>
        <button onclick="toggleDeleteColumn()">Annulla</button>
    </div>

    <script>
        // Mostra/nasconde sezione selezione colonna
        function toggleDeleteColumn() {
            const section = document.getElementById('deleteColumnSection');
            if (section.style.display === 'none') {
                section.style.display = 'block';
            } else {
                section.style.display = 'none';
                document.getElementById('columnSelect').value = '';
            }
        }

        // Reset tabella - reindirizza a droptable.php
        function resetTable() {
            if (confirm('Sei sicuro di voler resettare l\'intera tabella? Questa azione non può essere annullata!')) {
                window.location.href = 'droptable.php';
            }
        }

        // Elimina colonna - reindirizza a deletetable.php
        function deleteColumn() {
            const column = document.getElementById('columnSelect').value;

            if (!column) {
                alert('Seleziona una colonna da eliminare!');
                return;
            }

            if (confirm(`Sei sicuro di voler eliminare la colonna "${column}"?`)) {
                // Passa il nome della colonna tramite URL
                window.location.href = `deletetable.php?column=${encodeURIComponent(column)}`;
            }
        }
    </script>
</body>

</html>
